# Publie le dossier web/ sur GitHub Pages à chaque push sur main.
# Réglage à faire une fois dans le dépôt : Settings > Pages > Build and deployment > Source : « GitHub Actions ».
#
# Deux tâches : « construire » prépare et téléverse le paquet de la page, « publier » le met en ligne ensuite.
# Elles sont séparées exprès : dans une seule tâche, la publication cherchait le paquet une fraction de seconde après
# sa création et ne le trouvait pas (« No artifacts named "github-pages" were found », 24 novembre 2026 ;
# défaut connu, actions/deploy-pages n° 451).
#
# En cas d'échec, ne pas utiliser « Re-run » (la relance ajoute un second paquet à la même exécution et échoue aussi) :
# lancer une exécution neuve et complète, sans nouveau commit, par Actions > Publier la page web > Run workflow.
name: Publier la page web

on:
  push:
    branches: [main]
    paths: ["web/**", "docs/mention_information.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Copier la mention d'information dans web/
        run: cp docs/mention_information.md web/mention_information.md
      - name: Vérifier qu'aucun secret ne part avec la page
        run: |
          if grep -rE 'sb_secret_[A-Za-z0-9]' web/; then echo "Clé secrète détectée dans web/ : publication refusée"; exit 1; fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
